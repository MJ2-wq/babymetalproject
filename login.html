<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Fox Net</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --surface-2: #111111;
      --red: #ff003c;
      --red-glow: rgba(255, 0, 60, 0.25);
      --silver: #6b6b6b;
      --silver-light: #a0a0a0;
      --white: #f0f0f0;
      --line: rgba(255, 255, 255, 0.06);
      --font-heading: 'Cinzel', serif;
      --font-body: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .auth-page {
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .auth-header {
      text-align: center;
      padding: 40px 32px 24px;
      background: linear-gradient(180deg, rgba(255, 0, 60, 0.08) 0%, transparent 100%);
    }

    .auth-logo {
      font-size: 56px;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 20px rgba(255, 0, 60, 0.4));
    }

    .auth-title {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 900;
      color: var(--white);
      margin-bottom: 4px;
    }

    .auth-subtitle {
      font-size: 14px;
      color: var(--silver-light);
    }

    .auth-body {
      padding: 32px;
    }

    .auth-error {
      background: rgba(255, 0, 60, 0.1);
      border: 1px solid rgba(255, 0, 60, 0.3);
      border-radius: 10px;
      padding: 12px 16px;
      color: #ff6b6b;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .auth-error.show { display: block; }

    .auth-field {
      margin-bottom: 16px;
    }

    .auth-field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--silver-light);
      margin-bottom: 6px;
    }

    .auth-field input {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--white);
      font-size: 15px;
      font-family: var(--font-body);
      transition: all 0.2s ease;
    }

    .auth-field input:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(255, 0, 60, 0.15);
    }

    .auth-field input::placeholder {
      color: var(--silver);
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .auth-btn-primary {
      background: linear-gradient(135deg, var(--red), #cc0030);
      color: white;
    }

    .auth-btn-primary:hover {
      background: linear-gradient(135deg, #e60035, var(--red));
      box-shadow: 0 4px 20px rgba(255, 0, 60, 0.4);
      transform: translateY(-1px);
    }

    .auth-btn-secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--white);
      margin-top: 12px;
    }

    .auth-btn-secondary:hover {
      border-color: var(--silver);
      background: var(--surface-2);
    }

    .auth-divider {
      text-align: center;
      padding: 20px 0;
      color: var(--silver);
      font-size: 12px;
      position: relative;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 38%;
      height: 1px;
      background: var(--line);
    }

    .auth-divider::before { left: 0; }
    .auth-divider::after { right: 0; }

    .auth-footer {
      text-align: center;
      padding: 20px 32px 28px;
      border-top: 1px solid var(--line);
    }

    .auth-footer-text {
      font-size: 14px;
      color: var(--silver-light);
    }

    .auth-footer-link {
      color: var(--red);
      font-weight: 700;
      cursor: pointer;
      transition: color 0.2s ease;
      text-decoration: none;
    }

    .auth-footer-link:hover {
      color: #e60035;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--silver);
      cursor: pointer;
      transition: color 0.2s ease;
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--white);
    }

    @media (max-width: 480px) {
      .auth-page { padding: 12px; }
      .auth-header { padding: 32px 20px 20px; }
      .auth-body { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🦊</div>
        <div class="auth-title">Fox Net</div>
        <div class="auth-subtitle">Inicia sesión para ver conciertos, fotos y momentos de tus fans favoritos.</div>
      </div>

      <div class="auth-body">
        <div class="auth-error" id="loginError"></div>

        <form id="loginForm">
          <div class="auth-field">
            <label>Correo electrónico o nombre de usuario</label>
            <input type="text" id="loginEmail" placeholder="Correo electrónico o usuario" required>
          </div>

          <div class="auth-field">
            <label>Contraseña</label>
            <input type="password" id="loginPassword" placeholder="Contraseña" required>
          </div>

          <button type="submit" class="auth-btn auth-btn-primary">Iniciar Sesión</button>

          <div class="auth-divider">o</div>

          <button type="button" class="auth-btn auth-btn-demo" id="loginDemo" style="background:var(--surface-2);border:1px solid var(--line);color:var(--white);margin-top:0;">🦊 Entrar como Demo (Kitsune)</button>
        </form>
      </div>

      <div class="auth-footer">
        <a href="register.html" class="auth-btn auth-btn-secondary" style="display:block;text-decoration:none;">No tengo una cuenta</a>
      </div>
    </div>

    <a href="index.html" class="back-link">← Volver a Fox Net</a>
  </div>

  <script>
    var loginForm = document.getElementById('loginForm');
    var loginError = document.getElementById('loginError');

    function getUsers() {
      return JSON.parse(localStorage.getItem('foxnet_users') || '{}');
    }

    function setCurrentUser(email) {
      localStorage.setItem('foxnet_current', email);
    }

    function showError(msg) {
      loginError.textContent = msg;
      loginError.classList.add('show');
    }

    function hideError() {
      loginError.classList.remove('show');
    }

    // Check if already logged in
    (function() {
      var currentEmail = localStorage.getItem('foxnet_current');
      if (currentEmail) {
        var users = JSON.parse(localStorage.getItem('foxnet_users') || '{}');
        var user = users[currentEmail];
        var name = user ? user.name : currentEmail;
        var form = document.getElementById('loginForm');
        form.innerHTML = '<div style="text-align:center;padding:20px 0;">' +
          '<div style="font-size:48px;margin-bottom:16px;">🦊</div>' +
          '<div style="font-size:18px;font-weight:700;color:#fff;margin-bottom:8px;">Ya iniciaste sesión</div>' +
          '<div style="font-size:14px;color:#888;margin-bottom:24px;">Conectado como <strong style="color:#ff003c;">' + name + '</strong></div>' +
          '<a href="index.html" style="display:inline-block;padding:12px 32px;background:linear-gradient(135deg,#ff003c,#cc0030);color:#fff;border-radius:10px;font-weight:700;text-decoration:none;">Ir a Fox Net</a>' +
          '<div style="margin-top:16px;"><button onclick="localStorage.removeItem(\'foxnet_current\');location.reload();" style="background:none;border:none;color:#888;font-size:13px;cursor:pointer;">¿Cambiar de cuenta? Cierra sesión primero</button></div>' +
          '</div>';
        var divider = document.querySelector('.auth-divider');
        if (divider) divider.style.display = 'none';
      }
    })();

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      hideError();

      var emailOrUser = document.getElementById('loginEmail').value.trim().toLowerCase();
      var password = document.getElementById('loginPassword').value;
      var users = getUsers();

      // Find user by email or username
      var foundEmail = null;
      if (users[emailOrUser]) {
        foundEmail = emailOrUser;
      } else {
        var keys = Object.keys(users);
        for (var i = 0; i < keys.length; i++) {
          if (users[keys[i]].username === emailOrUser) {
            foundEmail = keys[i];
            break;
          }
        }
      }

      if (!foundEmail) {
        showError('No existe una cuenta con este correo o usuario. Regístrate primero.');
        return;
      }

      if (users[foundEmail].verified === false) {
        showError('Tu cuenta no está verificada. Revisa tu correo para el código de verificación.');
        return;
      }

      if (users[foundEmail].password !== password) {
        showError('Contraseña incorrecta. Intenta de nuevo.');
        return;
      }

      setCurrentUser(foundEmail);
      window.location.href = 'index.html';
    });

    document.getElementById('loginDemo').addEventListener('click', function() {
      var demoEmail = 'kitsune@foxnet.com';
      var users = getUsers();
      if (!users[demoEmail]) {
        users[demoEmail] = {
          name: 'Kitsune Metalero',
          username: 'kitsune_metal',
          email: demoEmail,
          password: 'demo123',
          verified: true,
          created: new Date().toISOString()
        };
        localStorage.setItem('foxnet_users', JSON.stringify(users));
      }
      setCurrentUser(demoEmail);
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
